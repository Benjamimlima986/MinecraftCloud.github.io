<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>CloudCraft — Minecraft</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="game-page">

    <div id="gameScreen">

        <div id="loading">

            <div class="spinner"></div>

            <h1 id="gameVersion">
                Minecraft
            </h1>

            <p id="gameMessage">
                Iniciando sua sessão...
            </p>

        </div>

        <!-- Futuramente o streaming do Minecraft ficará aqui -->
        <div id="minecraftStream">
        </div>

        <!-- Controles para celular -->
        <div id="mobileControls">

            <div class="movement">

                <button data-key="KeyW">▲</button>

                <div>
                    <button data-key="KeyA">◀</button>

                    <button data-key="KeyS">▼</button>

                    <button data-key="KeyD">▶</button>
                </div>

            </div>

            <div class="actions">

                <button data-key="Escape">
                    ESC
                </button>

                <button data-key="F1">
                    F1
                </button>

                <button data-key="KeyE">
                    🎒
                </button>

                <button data-key="Enter">
                    ENTER
                </button>

                <button data-key="KeyT">
                    CHAT
                </button>

                <button data-key="Space">
                    ⤴
                </button>

            </div>

        </div>

    </div>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const version =
    params.get("version") || "Desconhecida";

document.getElementById(
    "gameVersion"
).textContent =
    `Minecraft ${version}`;

document.getElementById(
    "gameMessage"
).textContent =
    "Preparando o Minecraft...";


// ------------------------------------------------
// CONTROLES MOBILE
// ------------------------------------------------

const buttons =
    document.querySelectorAll(
        "[data-key]"
    );

buttons.forEach(button => {

    const key =
        button.dataset.key;

    button.addEventListener(
        "touchstart",
        event => {

            event.preventDefault();

            sendKey(
                key,
                "down"
            );
        },
        { passive: false }
    );

    button.addEventListener(
        "touchend",
        event => {

            event.preventDefault();

            sendKey(
                key,
                "up"
            );
        },
        { passive: false }
    );

    button.addEventListener(
        "mousedown",
        () => {
            sendKey(key, "down");
        }
    );

    button.addEventListener(
        "mouseup",
        () => {
            sendKey(key, "up");
        }
    );

});


function sendKey(key, action) {

    /*
     * Futuramente isso será enviado
     * para o processo Minecraft através
     * do WebSocket.
     */

    console.log(
        "KEY:",
        key,
        action
    );
}

</script>

</body>

</html>
